services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scolaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scolaro123}
      POSTGRES_DB: ${POSTGRES_DB:-scolaro_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scolaro}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scolaro}:${POSTGRES_PASSWORD:-scolaro123}@postgres:5432/${POSTGRES_DB:-scolaro_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      PORT: 3333
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@scolaro.com}
      ADMIN_SENHA: ${ADMIN_SENHA:-admin123}
      RUN_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3333:3333"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
